# galaxy.yml — collection identity. Version bumps when roles ship.
namespace: softwarepatterns
name: infrastructure
version: 0.1.1
readme: README.md
authors:
  - Software Patterns
description: >-
  Resource-oriented infrastructure roles shared across estate boxes
  (docker, sshd, tailscale, fly6pn). Pin a release tag; bump deliberately.
license:
  - Apache-2.0
tags:
  - infrastructure
  - docker
  - sshd
  - tailscale
  - wireguard
repository: https://forgejo.softwarepatterns.com/softwarepatterns/ansible-infrastructure
issues: https://forgejo.softwarepatterns.com/softwarepatterns/ansible-infrastructure/issues
build_ignore:
  - .venv-gate
  - .molecule
  - .ansible
  - .git
  - .githooks
  - .gitignore
  - .forgejo
  - AGENTS.md
  - scripts
  - docs
  - requirements.txt
