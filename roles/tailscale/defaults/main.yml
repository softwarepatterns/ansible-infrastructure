---
# Auth key is supplied by the consumer (per-box secret), not defaults.
tailscale_authkey: ""
tailscale_hostname: "{{ inventory_hostname }}"
# Empty string = do not pass --advertise-tags
tailscale_advertise_tags: ""
tailscale_apt_suite: "{{ ansible_facts.distribution_release }}"
tailscale_apt_source_name: tailscale
tailscale_apt_key_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_apt_list_url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_apt_suite }}.tailscale-keyring.list"
tailscale_apt_key_url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_apt_suite }}.noarmor.gpg"
tailscale_packages:
  - tailscale
tailscale_accept_routes: false
tailscale_ssh: false
