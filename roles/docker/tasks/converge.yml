---
# converge.yml — Docker engine: keyring, deb822 source, packages, service.
# Does not own group membership, sudoers, or authorized_keys.

- name: Ensure Docker GPG key directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ docker_apt_key_sha256 }}"

- name: Add Docker apt repo (deb822)
  ansible.builtin.deb822_repository:
    name: "{{ docker_apt_source_name }}"
    types: [deb]
    uris: "{{ docker_apt_uris }}"
    suites: "{{ docker_apt_suites }}"
    components: "{{ docker_apt_components }}"
    architectures: "{{ docker_apt_architectures }}"
    signed_by: "{{ docker_apt_key_path }}"
    state: present

- name: Remove legacy one-line Docker apt source (superseded by deb822)
  ansible.builtin.file:
    path: "{{ docker_legacy_list_path }}"
    state: absent

# Debian docker.io / docker-compose / docker-buildx ship the same plugin
# paths as Docker CE plugins; remove them before installing CE or dpkg fails
# on file overwrite (mail-box cutover lesson).
- name: Remove Debian docker.io stack packages that conflict with Docker CE
  ansible.builtin.apt:
    name: "{{ docker_debian_conflict_packages }}"
    state: absent
    autoremove: false

- name: Ensure Docker CE and plugins are present
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Ensure docker service is enabled and started
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started
